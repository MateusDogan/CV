name: Compilar PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "CV.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Gravar CV.pdf no repositório
        run: |
          mv main.pdf CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV.pdf
          git diff --cached --quiet || git commit -m "build: compila CV.pdf [skip ci]"
          git push
